name: windows-build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  win:
    name: "Windows Build (${{ matrix.arch }})"
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, ARM64]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build project
        shell: pwsh
        run: |
          cmake -S . -B build -A ${{ matrix.arch }}
          cmake --build build --config RelWithDebInfo

      - name: Collect outputs
        shell: pwsh
        run: |
          mkdir _output
          Get-ChildItem build/bin -Recurse -Include *.exe,*.dll,*.pdb | Copy-Item -Destination _output
          Get-ChildItem _output

      - name: Smoke test - compile all quests with qc
        if: matrix.arch == 'x64'
        shell: pwsh
        run: |
          git clone -q --depth 1 https://github.com/d1str4ught/m2dev-server.git srv
          $q = "srv/share/locale/english/quest"
          Copy-Item _output/qc.exe "$q/qc.exe"
          cd $q
          python make.py *> make.log
          $code = $LASTEXITCODE
          $n = (Get-ChildItem object -Recurse -File).Count
          "make.py exit: $code, object files: $n"
          if ($code -ne 0) { Get-Content make.log -Tail 20; exit 1 }

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: output_win_${{ matrix.arch }}
          path: _output
